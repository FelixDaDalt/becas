<div class="text-center">
  <div class="input-group input-group-sm mb-3">
    <!-- Alta -->
    <button class="btn btn-info btn-sm me-2" type="button" (click)="alta()" *Roles="[0]"><i class="bi bi-plus-circle me-2"></i>Alta</button>
    <!-- Alta -->
    <input type="text" class="form-control" placeholder="Buscar..." aria-label="Buscar" aria-describedby="basic-addon1" [(ngModel)]="busqueda" (ngModelChange)="updateFilter()">
    <span class="input-group-text" id="basic-addon1"><i class="bi bi-search text-primary"></i></span>
  </div>
</div>

<ng-container *ngIf="(responsables$ | async) as responsables">
  <div class="table-responsive" *ngIf="(responsables | filterBy: filter).length > 0; else sinDatos">
    <table class="table table-hover table-bordered table-striped align-middle text-center">
      <thead class="table-primary">
        <tr>
          <th>Foto</th>
          <th>DNI</th>
          <th>Apellido y Nombre</th>
          <th>Colegio</th>
          <th>Estado</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let responsable of responsables || [] | filterBy: filter">
          <td class="text-center">
            <img [src]="apiFile + responsable.foto" alt="Foto" class="rounded-circle" style="height: 40px; width: 40px;" />
          </td>
          <td>{{ responsable.dni }}</td>
          <td>{{ responsable.apellido }}, {{ responsable.nombre }}</td>
          <td>{{ responsable.id_colegio_colegio?.nombre }}</td>
          <td>
            <span class="badge rounded-pill" [ngClass]="responsable.suspendido == 1 ? 'bg-danger' : 'bg-success'">
              {{ responsable.suspendido == 1 ? 'Suspendido' : 'Activo' }}
            </span>
          </td>
          <td class="text-center">
            <button type="button"
              class="btn btn-outline-primary btn-icon btn-icon-only btn-sm me-1"
              ngbTooltip="Reiniciar Contraseña"
              container="body"
              placement="bottom"
              (click)="reiniciarPassword(responsable.id)">
              <i class="bi bi-key-fill"></i>
            </button>

            <button type="button"
              class="btn btn-outline-primary btn-icon btn-icon-only btn-sm me-1"
              ngbTooltip="Suspender Ingreso"
              container="body"
              placement="bottom"
              (click)="suspender(responsable.id)">
              <i [ngClass]="responsable.suspendido == 1 ? 'bi bi-unlock-fill' : 'bi bi-lock-fill'"></i>
            </button>

            <div ngbDropdown class="btn-group" container="body">
              <button
                class="btn btn-outline-primary btn-icon btn-icon-only btn-sm me-1"
                ngbDropdownToggle>
                <i class="bi bi-three-dots-vertical"></i>
              </button>
              <div
                ngbDropdownMenu
                aria-labelledby="dropdownMenu"
                class="dropdown-menu-end">
                <button class="dropdown-item" (click)="verUsuario(responsable.id)">Ver</button>
                <button class="dropdown-item" (click)="editar(responsable)">Editar</button>
                <button class="dropdown-item" (click)="confirmarEliminar(responsable)">Eliminar</button>
              </div>
            </div>

          </td>
        </tr>
      </tbody>
    </table>
  </div>
</ng-container>



<ng-template #sinDatos>
  <app-sin-datos></app-sin-datos>
</ng-template>
