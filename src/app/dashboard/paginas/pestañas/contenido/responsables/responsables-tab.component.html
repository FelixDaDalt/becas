 <!--Search input-->

 <div class="text-center">
  <div class="input-group input-group-sm mb-3">
  <span class="input-group-text" id="basic-addon1"><i class="bi bi-search text-primary"></i></span>
    <input type="text" class="form-control" placeholder="Buscar..." aria-label="Buscar" aria-describedby="basic-addon1">
  </div>
</div>

<ng-container *ngIf="(responsables$|async) as responsables">
  <div class="row row-cols-1 row-cols-md-2 row-cols-xxl-3 g-2" *ngIf="responsables.length > 0; else sinDatos">
    <div class="col" *ngFor="let responsable of responsables">
      <div class="card">
        <div class="card-body">
          <div class="row g-0 sh-6">
            <div class="col-auto">
              <div class="card-img rounded-xl sh-6 sw-6 bg-primary text-white d-flex align-items-center justify-content-center">
                CD</div>
            </div>
            <div class="col">
              <div class="card-body d-flex flex-row pt-0 pb-0 ps-3 pe-0 h-100 align-items-center justify-content-between">
                <div class="d-flex flex-column">
                  <div>{{responsable.apellido}},{{responsable.nombre}}</div>
                  <div class="text-small text-muted">{{responsable.id_colegio_colegio?.nombre}}</div>
                  <span class="badge rounded-pill me-1 position-absolute s-2 t-n2 z-index-1"  [ngClass]="responsable.suspendido==1?'bg-danger':'bg-success'">
                    {{responsable.suspendido==1?'suspendido':'Activo'}}
                  </span>
                </div>
                <div class="d-flex">
                  <button type="button" class="btn btn-outline-primary btn-icon btn-sm ms-1" (click)="reiniciarPassword(responsable.id)"><i class="bi bi-key-fill"></i></button>
                  <button type="button" class="btn btn-outline-primary btn-icon btn-sm ms-1" (click)="suspender(responsable.id)">
                    <i [ngClass]="responsable.suspendido == 1 ? 'bi bi-unlock-fill' : 'bi bi-lock-fill'"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-container>


<ng-template #sinDatos>
  <app-sin-datos></app-sin-datos>
</ng-template>
