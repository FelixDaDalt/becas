<div class="text-center">
  <div class="input-group input-group-sm mb-3">
    <!-- Alta -->
    <button class="btn btn-info btn-sm me-2" type="button" (click)="alta()" *Roles="[1,2]">
      <i class="bi bi-plus-circle me-2"></i>Alta
    </button>
    <!-- Búsqueda -->
    <input type="text" class="form-control" placeholder="Buscar..." aria-label="Buscar" aria-describedby="basic-addon1"
           [(ngModel)]="busqueda" (ngModelChange)="updateFilter()">
    <span class="input-group-text" id="basic-addon1">
      <i class="bi bi-search text-primary"></i>
    </span>
  </div>
</div>

<ng-container *ngIf="(autorizados$ | async) as autorizados">
  <ng-container *ngIf="(autorizados | filterBy:filter).length>0;else sinDatos">

    <ngx-datatable
    class="bootstrap"
    [rows]="autorizados | filterBy:filter"
    [columnMode]="'force'"
    [headerHeight]="50"
    [footerHeight]="50"
    [rowHeight]="'auto'"
    [limit]="10"
    [scrollbarH]="true">



    <!-- Apellido y Nombre -->
    <ngx-datatable-column name="Apellido y Nombre" prop="apellido" [sortable]="true">
      <ng-template let-row="row" ngx-datatable-cell-template>
        {{ row.apellido }}, {{ row.nombre }}
      </ng-template>
    </ngx-datatable-column>

    <!-- DNI -->
    <ngx-datatable-column name="DNI" prop="dni" [sortable]="true" [width]="130">
      <ng-template let-row="row" ngx-datatable-cell-template>
        {{ row.dni }}
      </ng-template>
    </ngx-datatable-column>

    <!-- Teléfono -->
    <ngx-datatable-column name="Teléfono" prop="telefono" [sortable]="true" [width]="150">
      <ng-template let-row="row" ngx-datatable-cell-template>
        {{ row.telefono }}
      </ng-template>
    </ngx-datatable-column>

    <!-- Celular -->
    <ngx-datatable-column name="Celular" prop="celular" [sortable]="true" [width]="150">
      <ng-template let-row="row" ngx-datatable-cell-template>
        {{ row.celular }}
      </ng-template>
    </ngx-datatable-column>

    <!-- Email -->
    <ngx-datatable-column name="Email" prop="email" [sortable]="true">
      <ng-template let-row="row" ngx-datatable-cell-template>
        {{ row.email }}
      </ng-template>
    </ngx-datatable-column>

    <!--Cantidad -->
    <ngx-datatable-column name="Cantidad" prop="cantidad" [sortable]="true">
      <ng-template let-row="row" ngx-datatable-cell-template>
        {{ row.cantidad }}
      </ng-template>
    </ngx-datatable-column>

    <!-- Utilizadas -->
    <ngx-datatable-column name="Utilizadas" prop="utilizadas" [sortable]="true">
      <ng-template let-row="row" ngx-datatable-cell-template>
        {{ row.utilizadas }}
      </ng-template>
    </ngx-datatable-column>

     <!-- Disponibles-->
     <ngx-datatable-column name="Disponibles" prop="disponible" [sortable]="true">
      <ng-template let-row="row" ngx-datatable-cell-template>
        {{ row.disponible }}
      </ng-template>
    </ngx-datatable-column>

      <!-- Estado -->
      <ngx-datatable-column name="Estado" prop="suspendido" [sortable]="true" [width]="120">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <div class="text-center">
            <span class="badge rounded-pill"
                  [ngClass]="row.suspendido == 1 ? 'bg-danger' : 'bg-success'">
              {{ row.suspendido == 1 ? 'Suspendido' : 'Activo' }}
            </span>
          </div>
        </ng-template>
      </ngx-datatable-column>

    <!-- Acciones -->
    <ngx-datatable-column name="Acciones" [sortable]="false" [width]="200">
      <ng-template let-row="row" ngx-datatable-cell-template>
        <div class="text-center">
          <button type="button"
            class="btn btn-outline-primary btn-icon btn-icon-only btn-sm me-1"
            ngbTooltip="Suspender"
            container="body"
            placement="bottom"
            (click)="suspenderAutorizado(row.id)">
            <i [ngClass]="row.suspendido == 1 ? 'bi bi-unlock-fill' : 'bi bi-lock-fill'"></i>
          </button>

          <div ngbDropdown class="btn-group" container="body">
            <button
              class="btn btn-outline-primary btn-icon btn-icon-only btn-sm me-1"
              ngbDropdownToggle>
              <i class="bi bi-three-dots-vertical"></i>
            </button>
            <div ngbDropdownMenu class="dropdown-menu-end">
              <button class="dropdown-item" (click)="editarAutorizado(row)">Editar</button>
              <button class="dropdown-item" (click)="confirmarEliminar(row)">Eliminar</button>
            </div>
          </div>
        </div>
      </ng-template>
    </ngx-datatable-column>

    </ngx-datatable>

  </ng-container>
</ng-container>

<ng-template #sinDatos>
  <app-sin-datos></app-sin-datos>
</ng-template>
