

<h4>Historial</h4>
<ng-container *ngIf="historialTyc$ | async as historialTyc">
  <div class="accordion pt-3" id="accordionExample" *ngIf="historialTyc.length>0;else sinDatos">

    <div class="accordion-item" *ngFor="let tyc of historialTyc; let i = index">
      <div class="accordion-header" [id]="'heading' + i">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                [attr.data-bs-target]="'#collapse' + i"
                aria-expanded="false"
                [attr.aria-controls]="'collapse' + i">
          {{ tyc.fecha | date:'dd/MM/yyyy, h:mm a' }}
        </button>
      </div>
      <div [id]="'collapse' + i" class="accordion-collapse collapse"
          [attr.aria-labelledby]="'heading' + i"
          data-bs-parent="#accordionExample">
        <div class="accordion-body">
          <div [innerHTML]="tyc.contenido"></div>
        </div>
      </div>
    </div>
  </div>
</ng-container>

<ng-template #sinDatos>
  <app-sin-datos></app-sin-datos>
</ng-template>
