<div class="row g-3" *ngIf="parametros$ | async as parametros">
  <div class="col-12 col-md-6 col-lg-4" *ngFor="let parametro of parametross">
    <div class="card shadow-sm h-100">
      <div class="card-body d-flex flex-column justify-content-between">
        <div>
          <h6 class="text-muted text-uppercase small mb-2">{{ parametro.nombre }}</h6>
          <div class="text-primary fw-bold">{{ parametro.descripcion }}</div>
        </div>

        <div class="mt-3 row g-2 align-items-center" *ngIf="esFecha(parametro.valor); else campoTexto">
          <div class="col">
            <div class="input-group mb-3">
              <span class="input-group-text" id="basic-addon1">Día</span>
              <select class="form-select form-select-sm"
                      [(ngModel)]="parametro._dia"
                      (ngModelChange)="actualizarFechaCompuesta(parametro)">
                <option *ngFor="let dia of diasDisponibles" [ngValue]="dia">{{ dia }}</option>
              </select>
            </div>
          </div>
          <div class="col">
            <div class="input-group mb-3">
              <select class="form-select form-select-sm"
                      [(ngModel)]="parametro._mes"
                      (ngModelChange)="actualizarFechaCompuesta(parametro)">
                <option *ngFor="let mes of meses" [ngValue]="mes.valor">{{ mes.nombre }}</option>
              </select>
            </div>
          </div>
        </div>

        <ng-template #campoTexto>
          <div class="mt-3">
            <div class="input-group mb-3">
              <input [(ngModel)]="parametro.valor" class="form-control form-control-sm" type="text" />
              <span class="input-group-text" id="basic-addon1">Días</span>
            </div>
          </div>
        </ng-template>

        <div class="mt-3 text-end">
          <button class="btn btn-outline-primary btn-sm" (click)="guardarParametro(parametro)">
            <i class="bi bi-save me-1"></i>Guardar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
