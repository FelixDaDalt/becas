
      <div class="card">
        <div class="card-body pb-3">
          <form [formGroup]="formulario">
                <div class="editor">

                  <ngx-editor-menu [editor]="editor" [toolbar]="toolbar">
                  </ngx-editor-menu>
                  <ngx-editor [editor]="editor" formControlName="editorContent">
                  </ngx-editor>
                </div>
          </form>
        </div>
        <div class="card-footer border-0 pt-0">
          <app-boton-cargando (click)="guardar()" label="Guardar"></app-boton-cargando>
          <hr>
          <app-terminos-historial (historialTyc)="recibirTyc($event)"></app-terminos-historial>
        </div>
      </div>
