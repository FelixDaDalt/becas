<div class="row">

  <div class="col-6 mb-0 mt-0 p-1" >
    <div class="card border-end h-100">
      <h4 class="card-header pb-2 mb-2 mt-1 pt-1 text-primary">Provincias</h4>
      <ng-container *ngIf="zonas$ | async as zonas">
        <div class="card-body p-2" *ngIf="zonas.length > 0; else sinDatos" style="height: 320px; overflow-y: auto;">
          <div class="col" *ngFor="let zona of zonas; let i = index">
            <div class="d-flex flex-column nav-link"
                 [ngClass]="localidadForm.get('id_zona')?.value == zona.id ? 'active' : ''"
                 (click)="seleccionarZona(zona)"
                 style="cursor: pointer;">
              <div class="pb-2">
                <i class="bi bi-check"></i> {{ zona.nombre }}
              </div>
            </div>
          </div>
        </div>

      </ng-container>
    </div>

  </div>

  <div class="col-6 mb-0 mt-0 p-1" >
    <div class="card border-end h-100">
      <h4 class="card-header pb-2 mb-2 mt-1 pt-1 text-primary">
        {{ localidadNombre ? localidadNombre : 'Zona/Localidad' }}
      </h4>

      <!-- Card Body -->
      <div class="card-body p-2" *ngIf="localidades.length > 0; else sinDatos" style="height: 320px; overflow-y: auto;">
        <div class="col" *ngFor="let localidad of localidades">
          <div class="d-flex flex-column nav-link" style="cursor: pointer;" (click)="seleccionarLocalidad(localidad)">
            <div class="pb-2">
              <i class="bi bi-check"></i> {{ localidad.nombre }}
            </div>
          </div>
        </div>
      </div>

      <!-- Card Footer -->
      <div class="card-footer p-1">
        <h6 class="p-2 pb-0 fw-bold text-muted">
          {{localidadForm.get('id')?.value? 'Modificar Zona/Localidad en:':'Alta de Zona/Localidad en:'}}
          <span [innerHTML]="localidadNombre ? localidadNombre : '<span class=\'text-danger\'>Elegir provincia</span>'"></span>
        </h6>

        <form [formGroup]="localidadForm">
          <div class="input-group mb-1 mt-1 p-2">
            <input type="text" class="form-control" placeholder="Nombre..." formControlName="nombre">
            <button type="button" class="btn btn-outline-secondary" [disabled]="localidadForm.invalid" (click)="guardarLocalidad()">{{localidadForm.get('id')?.value?'Guardar':'+'}}</button>
            <button type="button" class="btn btn-outline-danger" (click)="confirmarEliminar()" *ngIf="localidadForm.get('id')?.value">Borrar</button>
            <button type="button" class="btn btn-outline-danger" (click)="cancelarSeleccion()" *ngIf="localidadForm.get('id')?.value">Cancelar</button>
          </div>
        </form>
      </div>
    </div>


  </div>

</div>

<ng-template #sinDatos>
  <app-sin-datos></app-sin-datos>
</ng-template>
