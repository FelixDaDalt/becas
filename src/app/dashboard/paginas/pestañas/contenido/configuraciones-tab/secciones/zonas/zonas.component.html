<div class="row">
  <div class="col-6 mb-0 mt-0 p-1" >
    <div class="card border-end h-100">
      <h4 class="card-header pb-2 mb-2 mt-1 pt-1 text-primary">Zonas</h4>
      <ng-container *ngIf="zonas$ | async as zonas">
        <div class="card-body mb-n2 scroll-out p-2" *ngIf="zonas.length>0; else sinDatos">
          <div class="scroll-by-count os-host os-theme-dark os-host-overflow os-host-overflow-y os-host-resize-disabled os-host-scrollbar-horizontal-hidden os-host-transition" data-count="4" data-childselector="a" data-subtractmargin="false" style="height: 320px;"><div class="os-resize-observer-host observed"><div class="os-resize-observer" style="left: 0px; right: auto;"></div></div><div class="os-size-auto-observer observed" style="height: calc(100% + 1px); float: left;"><div class="os-resize-observer"></div></div><div class="os-content-glue" style="margin: 0px -15px;"></div><div class="os-padding"><div class="os-viewport os-viewport-native-scrollbars-invisible" style="overflow-y: scroll;"><div class="os-content" style="padding: 0px 15px; height: 100%; width: 100%;">

              <div class="col" *ngFor="let zona of zonas; let i = index">
                <div class="card-body d-flex flex-column pt-0 pb-1 ps-3 pe-0 h-100 justify-content-center">
                  <div class="d-flex flex-column nav-link"
                    [ngClass]="localidadForm.get('id_zona')?.value == zona.id?'active':''" (click)="seleccionarZona(zona)" style="cursor: pointer;">
                    <div class="pb-2"><i class="bi bi-check"></i>{{zona.nombre}}</div>
                  </div>
                </div>
              </div>

          </div></div></div><div class="os-scrollbar os-scrollbar-horizontal os-scrollbar-unusable os-scrollbar-auto-hidden"><div class="os-scrollbar-track os-scrollbar-track-off"><div class="os-scrollbar-handle" style="width: 100%; transform: translate(0px, 0px);"></div></div></div><div class="os-scrollbar os-scrollbar-vertical os-scrollbar-auto-hidden" style="height: calc(100% - 8px);"><div class="os-scrollbar-track os-scrollbar-track-off"><div class="os-scrollbar-handle" style="height: 57.971%; transform: translate(0px, 0px);"></div></div></div><div class="os-scrollbar-corner"></div></div>
        </div>
      </ng-container>
      <div class="card-footer p-1">
        <h6 class="p-2 pb-0 fw-bold text-muted">Alta de Zona</h6>
        <form [formGroup]="zonaForm">
          <div class="input-group mb-1 mt-1 p-2">
            <input type="text" class="form-control" placeholder="Nombre..." formControlName="nombre">
            <button class="btn btn-outline-secondary" [disabled]="zonaForm.invalid" (click)="guardarZona()">+</button>
          </div>
        </form>
      </div>
    </div>

  </div>

  <div class="col-6 mb-0 mt-0 p-1" >
    <div class="card border-end h-100">
      <h4 class="card-header pb-2 mb-2 mt-1 pt-1 text-primary">{{localidadNombre?localidadNombre:'Localidad'}}</h4>
      <div class="card-body mb-n2 scroll-out p-2"  *ngIf="localidades.length>0; else sinDatos">
        <div class="scroll-by-count os-host os-theme-dark os-host-overflow os-host-overflow-y os-host-resize-disabled os-host-scrollbar-horizontal-hidden os-host-transition" data-count="4" data-childselector="a" data-subtractmargin="false" style="height: 320px;"><div class="os-resize-observer-host observed"><div class="os-resize-observer" style="left: 0px; right: auto;"></div></div><div class="os-size-auto-observer observed" style="height: calc(100% + 1px); float: left;"><div class="os-resize-observer"></div></div><div class="os-content-glue" style="margin: 0px -15px;"></div><div class="os-padding"><div class="os-viewport os-viewport-native-scrollbars-invisible" style="overflow-y: scroll;"><div class="os-content" style="padding: 0px 15px; height: 100%; width: 100%;">

            <div class="col" *ngFor="let localidad of localidades">
              <div class="card-body d-flex flex-column pt-0 pb-1 ps-3 pe-0 h-100 justify-content-center">
                <div class="d-flex flex-column nav-link">
                  <div class="pb-2"><i class="bi bi-check"></i>{{localidad.nombre}}</div>
                </div>
              </div>
            </div>

        </div></div></div><div class="os-scrollbar os-scrollbar-horizontal os-scrollbar-unusable os-scrollbar-auto-hidden"><div class="os-scrollbar-track os-scrollbar-track-off"><div class="os-scrollbar-handle" style="width: 100%; transform: translate(0px, 0px);"></div></div></div><div class="os-scrollbar os-scrollbar-vertical os-scrollbar-auto-hidden" style="height: calc(100% - 8px);"><div class="os-scrollbar-track os-scrollbar-track-off"><div class="os-scrollbar-handle" style="height: 57.971%; transform: translate(0px, 0px);"></div></div></div><div class="os-scrollbar-corner"></div></div>
      </div>
      <div class="card-footer p-1">
        <h6 class="p-2 pb-0 fw-bold text-muted">Alta de Localidad en: {{localidadNombre?localidadNombre:'Elegir zona'}}</h6>
        <form [formGroup]="localidadForm">
          <div class="input-group mb-1 mt-1 p-2">
            <input type="text" class="form-control" placeholder="Nombre..." formControlName="nombre">
            <button class="btn btn-outline-secondary" [disabled]="localidadForm.invalid" (click)="guardarLocalidad()">+</button>
          </div>
        </form>
      </div>
    </div>

  </div>
</div>

<ng-template #sinDatos>
  <app-sin-datos></app-sin-datos>
</ng-template>
