<div class="row">
  <!--Search input-->
  <div class="text-center">
    <div class="input-group input-group-sm mb-3">
      <input type="text" class="form-control" placeholder="Buscar..." aria-label="Buscar" aria-describedby="basic-addon1"  [(ngModel)]="busqueda" (ngModelChange)="updateFilter()">
      <span class="input-group-text" id="basic-addon1"><i class="bi bi-search text-primary"></i></span>
    </div>

  </div>

  <ng-container *ngIf="miembros$ | async as miembros">
    <ng-container *ngIf="(miembros| filterBy:filter).length > 0; else sinDatos">
      <div class="col-12 col-md-6 col-lg-4 mb-4" *ngFor="let miembro of miembros || [] | filterBy:filter">
        <div class="card h-100">
          <span class="badge badge-sm position-absolute e-0 t-n2 z-index-1"
                [ngClass]="{
                  'bg-warning': miembro.anfitrion,
                  'bg-info': !miembro.anfitrion
                }">
                <i class="pe-1" [ngClass]="{
                  'bi bi-star-fill': miembro.anfitrion,
                  'bi bi-bookmark-star-fill': !miembro.anfitrion
                }">
                </i>{{miembro.anfitrion?'Patrocinador':'Miembro'}}
          </span>
          <span class="badge badge-sm bg-danger position-absolute e-0 t-n2 z-index-1" *ngIf="miembro.borrado">
                COLEGIO BORRADO
          </span>

            <div class="card-body border-last-none h-100 p-0 ps-2 pt-2 pb-2">
            <div class="border-bottom border-separator-light">
              <div class="row g-0 sh-6">
                <div class="col-auto">
                  <img [src]="apiFile + miembro.id_colegio_colegio.foto" class="card-img rounded-xl sh-6 sw-6" alt="thumb" />
                </div>
                <div class="col">
                  <div class="card-body d-flex flex-row pt-0 pb-0 ps-3 pe-0 h-100 align-items-center justify-content-between">
                    <div class="d-flex flex-column">
                      <div>{{ miembro.id_colegio_colegio.nombre }}</div>
                      <div class="text-small text-muted">{{ miembro.id_colegio_colegio.cuit | formatDniCuit:'cuit'}}</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </ng-container>
  </ng-container>
</div>

<ng-template #sinDatos>
  <app-sin-datos mensaje=""></app-sin-datos>
</ng-template>
