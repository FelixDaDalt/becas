<div class="modal-body p-2 m-0">


  <div class="card">

      <img src="/assets/img/background/blue.jpg" class="card-img-top" alt="card image" style="height: 75px;">
      <div class="card-img-overlay d-flex flex-column justify-content-between">
        <div>
          <h1 class="display-4 text-white"><strong>Cantidad de Becas</strong></h1>
        </div>
      </div>

    <div class="card-body">
      <div class="col-12 mb-3">
        <label class="top-label">
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="text-primary bi bi-person-fill"></i></span>
            <input class="form-control form-control-sm" type="number" placeholder="Ingrese cantidad" [(ngModel)]="cantidad">
          </div>
          <span class="ms-5 text-primary">Cantidad</span>
          <!-- <app-error-formulario [control]="wizardForm.get('datosPrincipales.nombre')"></app-error-formulario> -->
        </label>
      </div>
    </div>

    <div class="card-footer text-center border-0 pt-1">
      <app-boton-cargando (action)="submitForm()" label="Guadar"></app-boton-cargando>
      <button type="button" class="btn btn-outline-secondary ms-2" (click)="cancelar()">Cancelar</button>
    </div>
  </div>
</div>
