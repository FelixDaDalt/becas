<div class="modal-body p-2 m-0">
  <div class="card">
    <!-- Header con imagen -->
    <img src="/assets/img/background/blue.jpg" class="card-img-top" alt="card image" style="height: 75px;">
    <div class="card-img-overlay d-flex flex-column justify-content-between">
      <div>
        <h1 class="display-4 text-white"><strong>Solicitud</strong></h1>
      </div>
    </div>

    <!-- Contenido del formulario -->
    <form [formGroup]="formSolicitud" (ngSubmit)="enviarFormulario()">
      <div class="card-body mb-2 pb-0">
        <!-- ID Beca -->
         <div class="d-flex justify-content-center">
          <div class="card mb-3 shadow-sm " style="width: 50%;">
            <div class="card-body d-flex align-items-center">
              <div class="icon-container bg-primary text-white rounded-circle d-flex justify-content-center align-items-center me-3" style="width: 50px; height: 50px;">
                <i class="bi bi-person-lines-fill fs-4"></i>
              </div>
              <div>
                <h5 class="card-title mb-0">Solicitudes disponibles</h5>
                <p class="card-text text-muted mb-0 fs-5">{{ maximo }}</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Sistema de pestañas para alumnos -->
        <ul class="nav nav-tabs" id="alumnosTabs" role="tablist">
          <li class="nav-item" *ngFor="let alumno of alumnos.controls; let i = index">
            <button
              class="nav-link"
              [class.active]="i === activeTabIndex"
              (click)="setActiveTab(i)">
              Solicitud {{ i + 1 }}
              <span class="ms-2 text-danger" (click)="eliminarAlumno(i, $event)">✖</span>
            </button>
          </li>
        </ul>

        <div class="tab-content mb-0 pb-0">
          <div class="tab-pane fade" *ngFor="let alumno of alumnos.controls; let i = index"
               [class.show]="i === activeTabIndex" [class.active]="i === activeTabIndex">
            <div [formGroup]="alumnos.at(i)" class="border rounded p-2 mt-2">
              <h2>Formulario Alumno {{ i + 1 }}</h2>
              <div class="row">
                <div class="mb-2 col-6">
                  <label class="form-label">Nombre:</label>
                  <input class="form-control form-control-sm" formControlName="nombre" placeholder="Nombre" />
                  <app-error-formulario [control]="alumnos.at(i).get('nombre')"></app-error-formulario>
                </div>

                <div class="mb-2 col-6">
                  <label class="form-label">Apellido:</label>
                  <input class="form-control form-control-sm" formControlName="apellido" placeholder="Apellido" />
                  <app-error-formulario [control]="alumnos.at(i).get('apellido')"></app-error-formulario>
                </div>

                <div class="mb-2 col-6">
                  <label class="form-label">DNI:</label>
                  <input class="form-control form-control-sm" formControlName="dni" placeholder="DNI" />
                  <app-error-formulario [control]="alumnos.at(i).get('dni')"></app-error-formulario>
                </div>

                <div class="mb-2 col-6">
                  <label class="form-label">Fecha de Nacimiento:</label>
                  <input class="form-control form-control-sm" type="date" formControlName="fecha_nacimiento" />
                  <app-error-formulario [control]="alumnos.at(i).get('fecha_nacimiento')"></app-error-formulario>
                </div>

                <div class="col-12">
                  <label class="form-label">Detalle:</label>
                  <textarea class="form-control form-control-sm" formControlName="detalle" placeholder="Detalle" rows="4"></textarea>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Botón para agregar alumno -->
      <div class="text-center mb-3">
        <button *ngIf="maximo>0" type="button" class="btn btn-outline-primary" (click)="agregarAlumno()"
          [disabled]="alumnos.invalid">
          Agregar Solicitud
        </button>
      </div>

      <!-- Footer -->
      <div class="card-footer text-center border-0 pt-1">
        <button type="submit" class="btn btn-primary" [disabled]="formSolicitud.invalid">Enviar</button>
        <button type="button" class="btn btn-outline-secondary ms-2" (click)="cancelar()">Cancelar</button>
      </div>
    </form>
  </div>
</div>
