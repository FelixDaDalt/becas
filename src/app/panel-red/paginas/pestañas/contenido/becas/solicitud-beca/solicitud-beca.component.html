<div class="modal-body p-2 m-0">
  <div class="card">
    <!-- Header con imagen -->
    <img src="/assets/img/background/blue.jpg" class="card-img-top" alt="card image" style="height: 75px;">
    <div class="card-img-overlay d-flex flex-column justify-content-between">
      <div>
        <h1 class="display-4 text-white"><strong>Solicitud</strong></h1>
      </div>
    </div>
    <div class="card-body">
      <div class="text-center mb-4">
        <h3 class="text-primary fw-bold">Solicitud de Beca</h3>
        <p class="text-muted">Completá los datos del alumno</p>
        <div class="d-inline-flex align-items-center px-3 py-2 rounded bg-light shadow-sm mt-2">
          <span class="badge rounded-circle me-2"
                [ngClass]="maximo === 0 ? 'bg-danger' : 'bg-success'">
            {{ maximo }}
          </span>
          <span class="fw-semibold">Solicitudes disponibles</span>
        </div>
      </div>

      <form [formGroup]="formSolicitud">
        <div *ngFor="let alumno of alumnos.controls; let i = index" class="card shadow-sm mb-3 p-3 border-start border-4"
            [ngClass]="activeTabIndex === i ? 'border-primary' : 'border-light'">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h5 class="mb-0 text-primary">Formulario Alumno {{ i + 1 }}</h5>
            <button class="btn btn-sm btn-outline-danger" (click)="eliminarAlumno(i, $event)">✖</button>
          </div>

          <div [formGroup]="alumnos.at(i)">
            <div class="row g-2">
              <div class="col-md-6">
                <label class="form-label">Nombre</label>
                <input class="form-control form-control-sm" formControlName="nombre" />
                <app-error-formulario [control]="alumnos.at(i).get('nombre')"></app-error-formulario>
              </div>
              <div class="col-md-6">
                <label class="form-label">Apellido</label>
                <input class="form-control form-control-sm" formControlName="apellido" />
                <app-error-formulario [control]="alumnos.at(i).get('apellido')"></app-error-formulario>
              </div>
              <div class="col-md-6">
                <label class="form-label">DNI</label>
                <input class="form-control form-control-sm" formControlName="dni" />
                <app-error-formulario [control]="alumnos.at(i).get('dni')"></app-error-formulario>
              </div>
              <div class="col-md-6">
                <label class="form-label">Fecha de Nacimiento</label>
                <input type="date" class="form-control form-control-sm" formControlName="fecha_nacimiento" />
                <app-error-formulario [control]="alumnos.at(i).get('fecha_nacimiento')"></app-error-formulario>
              </div>
              <div class="col-12">
                <label class="form-label">Hijo de</label>
                <ng-select [items]="autorizadosDisponibles" bindLabel="label" bindValue="id"
                          formControlName="id_pariente" placeholder="Seleccione un autorizado"
                          [compareWith]="compararAutorizados">
                </ng-select>
                <app-error-formulario [control]="alumnos.at(i).get('id_pariente')"></app-error-formulario>
              </div>
              <div class="col-12">
                <label class="form-label">Detalle</label>
                <textarea class="form-control form-control-sm" rows="3" formControlName="detalle"></textarea>
              </div>
            </div>
          </div>
        </div>

        <div class="text-center my-3">
          <button type="button" class="btn btn-outline-success" (click)="agregarAlumno()" [disabled]="alumnos.invalid || maximo === 0">
            Agregar Solicitud
          </button>
          <div *ngIf="alumnos.invalid || maximo === 0" class="mt-2">
            <div class="badge bg-warning-subtle text-dark px-3 py-2 rounded-pill" style="font-size: 0.85rem;">
              {{ alumnos.invalid
                  ? 'Complete el formulario actual para agregar mas solicitudes'
                  : 'No posee más solicitudes disponibles' }}
            </div>
          </div>
        </div>

        <div class="text-center pt-2 border-top">
          <app-boton-cargando (action)="enviarFormulario()" label="Enviar"
            *ngIf="formSolicitud.get('alumnos')?.value.length > 0"></app-boton-cargando>
          <button type="button" class="btn btn-outline-secondary ms-2" (click)="cancelar()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>
