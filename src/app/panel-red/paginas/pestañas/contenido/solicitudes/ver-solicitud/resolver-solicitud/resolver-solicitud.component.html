<div class="resolver-solicitud">
  <form [formGroup]="resolverForm">

  <div class="form-group mb-3">
    <label for="resolucion" class="form-label">Resolución</label>
    <select id="resolucion" class="form-select" formControlName="id_resolucion">
      <option [ngValue]='null' selected disabled>Seleccionar</option>
      <option [ngValue]='2'>Rechazado</option>
      <option [ngValue]='1'>Aprobado</option>
    </select>
    <app-error-formulario [control]="resolverForm.get('id_resolucion')"></app-error-formulario>
  </div>

  <div class="form-group mb-3">
    <label for="comentario" class="form-label">Comentario</label>
    <textarea
      formControlName="res_comentario"
      id="comentario"
      class="form-control"
      rows="4"
      placeholder="Ingrese un comentario opcional..."
    ></textarea>
    <app-error-formulario [control]="resolverForm.get('res_comentario')"></app-error-formulario>
  </div>
</form>
  <app-boton-cargando (action)="guardar()" label="Resolver"></app-boton-cargando>

</div>
