


    <div class="modal-body">
      <div class="alert alert-info d-flex align-items-center mb-3 p-3" style="border-radius: 10px;">
        <i class="bi bi-info-circle-fill me-3" style="font-size: 1.8rem; color: #0d6efd;"></i>
        <div>
          <p class="mb-2 text-black font-weight-bold" style="font-size: 2rem;">{{usuario?.nombre}}, {{usuario?.apellido}}</p>
          <p class="mb-0">Es necesario aceptar los Términos y Condiciones para continuar.</p>
        </div>
      </div>

      <div class="terms-content" style="max-height: 300px; overflow-y: auto; padding: 1rem; border: 1px solid #ddd; border-radius: 5px;" *ngIf="terminos | async as tyc">
        <h6><strong>Términos y Condiciones</strong></h6>
        <h6><strong>Última actualización: </strong> {{tyc.fecha | date:'dd/MM/yyyy, h:mm a'}}</h6>
        <div [innerHTML]="tyc.contenido"></div>
      </div>

      <form [formGroup]="formulario" class="mt-3">
        <span class="font-weight-bold text-info ms-2">Ingrese su contraseña para aceptar</span>
        <div class="d-flex align-items-center filled form-group form-group-sm tooltip-end-top">
          <i data-acorn-icon="lock-off" class="me-2"></i>
          <input
            [type]="mostrarPassword ? 'text' : 'password'"
            class="form-control form-control-sm me-2"
            name="password"
            placeholder="Contraseña"
            formControlName="password"
          />
          <a class="text-small me-2" (click)="cambiarVisibilidad()" style="cursor: pointer;">Revelar</a>

          <button type="button" class="btn btn-primary btn-sm me-2" (click)="aceptar()" [disabled]="!formulario.valid">Aceptar</button>
          <button type="button" class="btn btn-secondary btn-sm" (click)="cancelar()">Cancelar</button>

        </div>
        <app-error-formulario [control]="formulario.get('password')" class="me-2"></app-error-formulario>
      </form>
  </div>
