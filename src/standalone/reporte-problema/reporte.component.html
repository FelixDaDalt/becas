<div class="modal-header">
  <h5 class="modal-title"><i class="bi bi-exclamation-triangle-fill text-warning me-2"></i> Reportar un problema (En Desarollo)</h5>
  <button type="button" class="btn-close" (click)="cerrar()" aria-label="Cerrar"></button>
</div>

<div class="modal-body">
  <form [formGroup]="formularioReporte" (ngSubmit)="enviarReporte()" *ngIf="!enviado; else mensajeExito">
    <div class="mb-3">
      <label class="form-label">Asunto</label>
      <input type="text" class="form-control" formControlName="asunto" placeholder="Ej. No puedo cargar un recurso">
    </div>

    <div class="mb-3">
      <label class="form-label">Descripción</label>
      <textarea class="form-control" rows="4" formControlName="descripcion"
                placeholder="Describa detalladamente el problema..."></textarea>
    </div>

    <div class="text-end">
      <button type="button" class="btn btn-secondary me-2" (click)="cerrar()">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="formularioReporte.invalid">
        <i class="bi bi-send me-1"></i> Enviar
      </button>
    </div>
  </form>
</div>

<ng-template #mensajeExito>
  <div class="text-center p-4">
    <i class="bi bi-check-circle-fill text-success fs-4 mb-3"></i>
    <h5 class="text-success fs-2">¡Gracias por tu reporte!</h5>
    <p class="text-muted fs-2">Lo revisaremos a la brevedad.</p>
  </div>
</ng-template>
