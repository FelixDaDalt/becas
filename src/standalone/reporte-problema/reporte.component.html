<div class="modal-header">
  <h5 class="modal-title"><i class="bi bi-exclamation-triangle-fill text-warning me-2"></i> Reportar un problema</h5>
  <button type="button" class="btn-close" (click)="cerrar()" aria-label="Cerrar"></button>
</div>

<div class="modal-body">
  <form [formGroup]="formularioReporte" (ngSubmit)="enviarReporte()">
    <div class="mb-3">
      <label class="form-label">Asunto</label>
      <input type="text" class="form-control" formControlName="asunto" placeholder="Ej. No puedo cargar un recurso">
    </div>

    <div class="mb-3">
      <label class="form-label">Descripción</label>
      <textarea class="form-control" rows="4" formControlName="descripcion"
                placeholder="Describa detalladamente el problema..."></textarea>
    </div>

    <div class="text-end">
      <button type="button" class="btn btn-secondary me-2" (click)="cerrar()">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="formularioReporte.invalid">
        <i class="bi bi-send me-1"></i> Enviar
      </button>
    </div>
  </form>
</div>
