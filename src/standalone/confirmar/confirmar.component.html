<div class="modal-body p-2 m-0">
  <div class="card">

    <img src="/assets/img/background/blue.jpg" class="card-img-top" alt="card image" style="height: 75px;">
    <div class="card-img-overlay d-flex flex-column justify-content-between">
      <div>
        <h1 class="display-4 text-white"><strong>Eliminar</strong></h1>
      </div>
    </div>

    <div class="card-body text-center">

      <div class="my-3">
        <i class="bi bi-exclamation-triangle-fill text-warning fs-1"></i>
      </div>
      <p class="fs-5">¿Estás seguro de que deseas eliminar a <strong>{{ itemAEliminar }}</strong>?</p>
      <p class="fs-3">¡No podrás recuperarlo después!</p>
      <div class="d-flex justify-content-center gap-3 mt-4">
        <button type="button" class="btn btn-primary" (click)="confirmar()">Aceptar</button>
        <button type="button" class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
      </div>
    </div>
  </div>
</div>
